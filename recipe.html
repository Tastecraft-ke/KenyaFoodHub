<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe | Kenya Food Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Blurred Recipe Background -->
    <div id="recipe-background"></div>

    <!-- Dark overlay -->
    <div class="recipe-overlay"></div>


    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            Kenya<span>Food</span>Hub
        </div>

        <a href="index.html" class="back-button">
            ← Back to Recipes
        </a>

    </header>


    <!-- Recipe Content -->
    <main class="recipe-page">

        <section class="recipe-container">


            <!-- Recipe Image -->
            <div class="recipe-image">

                <img
                    id="recipe-image"
                    src=""
                    alt="Recipe"
                >

            </div>


            <!-- Recipe Information -->
            <div class="recipe-content">

                <p class="recipe-category">
                    KENYAN RECIPE
                </p>


                <h1 id="recipe-title">
                    Loading Recipe...
                </h1>


                <p
                    id="recipe-description"
                    class="recipe-description">
                </p>


                <!-- Recipe Statistics -->
                <div class="recipe-stats">

                    <div>
                        <span>PREP TIME</span>
                        <strong id="prep-time">--</strong>
                    </div>

                    <div>
                        <span>COOK TIME</span>
                        <strong id="cook-time">--</strong>
                    </div>

                    <div>
                        <span>SERVES</span>
                        <strong id="servings">4</strong>
                    </div>

                </div>


                <!-- Nutrition -->
                <div class="recipe-section">

                    <h2>
                        Nutrition
                    </h2>

                    <p id="nutrition"></p>

                </div>


                <!-- Benefits -->
                <div class="recipe-section">

                    <h2>
                        Benefits
                    </h2>

                    <p id="benefits"></p>

                </div>


                <!-- Precautions -->
                <div class="recipe-section">

                    <h2>
                        Things to Consider
                    </h2>

                    <p id="precautions"></p>

                </div>


                <!-- Ingredients -->
                <div class="recipe-section">

                    <h2>
                        Ingredients
                    </h2>

                    <ul id="ingredients"></ul>

                </div>


                <!-- Instructions -->
                <div class="recipe-section">

                    <h2>
                        Cooking Instructions
                    </h2>

                    <ol id="instructions"></ol>

                </div>

            </div>

        </section>

    </main>


    <!-- Recipe JavaScript -->
    <script src="recipe.js"></script>

</body>

</html>
